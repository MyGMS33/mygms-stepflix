name: StepFlix checks

on:
  push:
    branches: ["main", "feat/stepflix-*"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Python syntax
        run: python -m py_compile app.py
      - name: Extract and validate browser JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path("static/index.html").read_text()
          scripts = re.findall(r"<script>(.*?)</script>", html, re.S)
          assert scripts, "No inline script found"
          Path("/tmp/stepflix.js").write_text(scripts[-1])
          PY
          node --check /tmp/stepflix.js
      - name: Install backend dependencies
        run: pip install -r requirements.txt
      - name: Import backend and initialize database
        env:
          STEPFLIX_DB: /tmp/stepflix.db
        run: python -c "import app; print(app.app.title)"
